name: evals

# The eval set against the real API, every night and on demand. Costs about ten cents a
# run on Opus; the budget flag caps a runaway. Needs ANTHROPIC_API_KEY in the repo secrets.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate
        default: claude-opus-5-5

jobs:
  invoice-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.5', coverage: none }
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate && touch database/database.sqlite && php artisan migrate --force
      - run: php artisan claude:eval invoice-drafts --model="${{ inputs.model || 'claude-opus-5-5' }}" --budget=1.00 --min=90 --save
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
